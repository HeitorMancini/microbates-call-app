[package]
name = "media"
description = "Real media for Sheeshcord: LiveKit transport, cpal audio, WGC screen capture and fakes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "sheeshcord_media"
path = "src/lib.rs"

[features]
default = []
# Synthetic sources (440 Hz tone, video test pattern) for tests/CI without hardware.
fake = []

[dependencies]
async-trait = "0.1"
core = { path = "../core" }
cpal = "0.18"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jpeg-encoder = "0.7"
livekit = { version = "0.10", features = ["native-tls"] }
# RNNoise (pure Rust) for microphone noise suppression.
nnnoiseless = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-capture = "2"
# Hardware screen encoder (Media Foundation MFTs: AMD AMF, NVIDIA NVENC, Intel QSV).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
wasapi = "0.27.0"

[dev-dependencies]
integration-tests = { path = "../integration-tests" }
media = { path = ".", features = ["fake"] }
