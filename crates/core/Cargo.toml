[package]
name = "core"
description = "Sheeshcord room state machine, independent of UI and LiveKit"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `core` would shadow Rust's built-in `core` crate, so the library gets a distinct name.
name = "sheeshcord_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
