name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_load:
        description: "Rodar o teste de carga"
        type: boolean
        default: true
      participants:
        description: "Participantes no teste de carga"
        default: "7"
      resolution:
        description: "Resolução da tela sintética (LxA)"
        default: "1920x1080"
  schedule:
    # Segunda-feira 06:00 UTC: teste de carga semanal.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LIVEKIT_VERSION: "1.13.11"
  NODE_VERSION: "22"
  PNPM_VERSION: "12"

defaults:
  run:
    shell: pwsh

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Instalar livekit-server
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "livekit"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir "livekit.zip"
          Invoke-WebRequest -Uri "https://github.com/livekit/livekit/releases/download/v$env:LIVEKIT_VERSION/livekit_${env:LIVEKIT_VERSION}_windows_amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter livekit-server.exe | Select-Object -First 1
          if (-not $exe) { throw "livekit-server.exe não encontrado no zip" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe.FullName --version

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test (unit + integração com livekit-server)
        run: cargo test --workspace --locked

  frontend:
    name: Frontend (lint, vitest, build)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright, UI mock)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium do Playwright
        run: pnpm --filter @sheeshcord/ui exec playwright install --with-deps chromium
      - name: Playwright (Vite em ?mock=1)
        env:
          CI: "true"
        run: pnpm --filter @sheeshcord/ui exec playwright test --reporter=list,html
      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 14
          if-no-files-found: ignore

  tauri-build:
    name: Build do app (NSIS)
    if: github.event_name != 'schedule'
    needs: [rust, frontend]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tauri build
        run: pnpm tauri build --bundles nsis
      - name: Instalador
        uses: actions/upload-artifact@v4
        with:
          name: sheeshcord-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  load:
    name: Teste de carga (manual/semanal)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_load)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PARTICIPANTS: ${{ inputs.participants || '7' }}
      RESOLUTION: ${{ inputs.resolution || '1920x1080' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: load
      - name: Instalar livekit-server
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "livekit"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir "livekit.zip"
          Invoke-WebRequest -Uri "https://github.com/livekit/livekit/releases/download/v$env:LIVEKIT_VERSION/livekit_${env:LIVEKIT_VERSION}_windows_amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter livekit-server.exe | Select-Object -First 1
          if (-not $exe) { throw "livekit-server.exe não encontrado no zip" }
          "LIVEKIT_SERVER_BIN=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compilar load-test (release)
        run: cargo build -p load-test --release --locked
      - name: Rodar teste de carga
        run: |
          $log = Join-Path $env:RUNNER_TEMP "livekit-load.log"
          $server = Start-Process -FilePath $env:LIVEKIT_SERVER_BIN `
            -ArgumentList "--config", "deploy/livekit.dev.yaml", "--node-ip", "127.0.0.1" `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru -NoNewWindow
          $code = 2
          try {
            $ready = $false
            for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
              try { $c = [Net.Sockets.TcpClient]::new("127.0.0.1", 7880); $c.Dispose(); $ready = $true }
              catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw "livekit-server não subiu" }
            $w, $h = $env:RESOLUTION -split 'x'
            ./target/release/load-test.exe --url ws://127.0.0.1:7880 `
              -n $env:PARTICIPANTS --width $w --height $h --fps 30 --bitrate-kbps 3000 `
              --duration-secs 30 --output load-report.json
            $code = $LASTEXITCODE
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
          exit $code
      - name: Relatório de carga
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: |
            load-report.json
            ${{ runner.temp }}/livekit-load.log*
          if-no-files-found: ignore
