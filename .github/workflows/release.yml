name: Release

# Em tags v*, gera o instalador NSIS e publica no GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "12"
  # Caminho curto: os headers do webrtc-sys estouram o MAX_PATH do Windows.
  CARGO_TARGET_DIR: C:\t

jobs:
  installer:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: ". -> C:\\t"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tauri build
        run: pnpm tauri build --bundles nsis
      - name: Anexar ao Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: C:/t/release/bundle/nsis/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Artefato (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sheeshcord-windows-installer
          path: C:/t/release/bundle/nsis/*.exe
          if-no-files-found: error
