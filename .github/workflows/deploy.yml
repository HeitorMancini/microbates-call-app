name: Publicar token-server

# Constrói a imagem x86_64 do token-server e publica no GHCR a cada push na main.
# O servidor (casa, IP dinâmico) não é acessível pelo GitHub: ele mesmo baixa a imagem nova
# com o timer `deploy/sheeshcord-update.timer` (veja deploy/README.md).
on:
  push:
    branches: [main]
    paths:
      - "crates/token-server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/heitormancini/sheeshcord-token-server

jobs:
  image:
    name: Imagem token-server (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/token-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
