# LiveKit em produção (VM Oracle com IP público; ~7 pessoas).
# As chaves vêm da variável LIVEKIT_KEYS (docker-compose.yml + .env).
port: 7880

rtc:
  # Fallback ICE/TCP para redes que bloqueiam UDP.
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # A VM só conhece o IP privado; o LiveKit descobre o público via STUN.
  use_external_ip: true

room:
  empty_timeout: 300
  max_participants: 16

logging:
  level: info
