[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# RNNoise runs once per 10 ms of microphone audio: unoptimised it cannot keep up in debug builds.
[profile.dev.package.nnnoiseless]
opt-level = 3
